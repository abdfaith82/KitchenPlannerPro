name: Android Cloud APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Keystore & Environment
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          sed -i 's/^[[:space:]]*alias(libs\.plugins\.google\.devtools\.ksp)/  \/\/ alias(libs.plugins.google.devtools.ksp)/g' app/build.gradle.kts build.gradle.kts || true
          sed -i 's/^[[:space:]]*"ksp"(libs\.androidx\.room\.compiler)/  \/\/ "ksp"(libs.androidx.room.compiler)/g' app/build.gradle.kts || true
          rm -rf app/build/generated/ksp

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: gradle assembleDebug --no-configuration-cache --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KitchenPlannerPro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
